<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroTik Hotspot - Kominfo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #070d1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(0, 82, 204, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 82, 204, 0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        .orb1 {
            position: fixed;
            top: -200px; left: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 82, 204, 0.15) 0%, transparent 70%);
            z-index: 0;
            animation: pulse 6s ease-in-out infinite;
        }

        .orb2 {
            position: fixed;
            bottom: -150px; right: -150px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.1) 0%, transparent 70%);
            z-index: 0;
            animation: pulse 8s ease-in-out infinite reverse;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .splash {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
        }

        .logo-wrap {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 82, 204, 0.12);
            border: 1px solid rgba(0, 82, 204, 0.35);
            border-radius: 16px;
            padding: 16px 24px;
            margin-bottom: 32px;
        }

        .kominfo-logo-icon {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }
            flex-shrink: 0;
        }

        .kominfo-text .brand {
            font-size: 18px;
            font-weight: 700;
            color: #4da6ff;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .kominfo-text .sub {
            font-size: 10px;
            color: rgba(150, 190, 255, 0.6);
            letter-spacing: 0.3px;
            text-transform: uppercase;
            display: none;
        }

        .title {
            color: #e8f0ff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.2px;
        }

        .subtitle {
            color: rgba(120, 160, 220, 0.6);
            font-size: 13px;
            margin-bottom: 36px;
        }

        /* Spinner */
        .spinner-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(0, 82, 204, 0.2);
            border-top-color: #0077ff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            color: rgba(100, 150, 220, 0.7);
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }
    </style>
</head>
<body>
    <div class="orb1"></div>
    <div class="orb2"></div>

    <div class="splash">
        <div class="logo-wrap">
            <img src="logo-kominfo.png" class="kominfo-logo-icon" alt="Logo Kominfo">
            <div class="kominfo-text">
                <div class="brand">KOMINFO</div>
            </div>
        </div>

        <div class="title">Layanan WiFi Publik</div>
        <div class="subtitle">MikroTik Hotspot Management System</div>

        <div class="spinner-wrap">
            <div class="spinner"></div>
            <div class="loading-text">Memuat<span class="dots"></span></div>
        </div>
    </div>

    <script>
        window.location.href = "/login.html";
    </script>
</body>
</html>
