<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Hotspot - Kominfo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #070d1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(0, 82, 204, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 82, 204, 0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -200px; right: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 82, 204, 0.12) 0%, transparent 70%);
            z-index: 0;
            animation: pulse 7s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .orb-left {
            position: fixed;
            bottom: -150px; left: -150px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.08) 0%, transparent 70%);
            z-index: 0;
            animation: pulse 9s ease-in-out infinite reverse;
        }

        .container {
            background: rgba(10, 20, 40, 0.85);
            border: 1px solid rgba(0, 100, 220, 0.3);
            border-radius: 20px;
            box-shadow:
                0 0 0 1px rgba(0, 100, 220, 0.1),
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 20px; right: 20px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #0052cc, #00aaff, #0052cc, transparent);
            border-radius: 2px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
        }

        .kominfo-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 82, 204, 0.15);
            border: 1px solid rgba(0, 82, 204, 0.4);
            border-radius: 12px;
            padding: 10px 18px;
        }

        .kominfo-logo-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }

        .kominfo-text .brand {
            font-size: 13px;
            font-weight: 700;
            color: #4da6ff;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .divider-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 100, 220, 0.5), transparent);
            margin: 14px auto;
        }

        .header h1 {
            color: #e8f0ff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .header p {
            color: rgba(150, 180, 230, 0.7);
            font-size: 13px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 16px;
        }

        .form-grid .form-group-full {
            grid-column: 1 / -1;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: rgba(180, 210, 255, 0.85);
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 0.2px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(0, 100, 220, 0.25);
            border-radius: 10px;
            font-size: 14px;
            color: #e8f0ff;
            font-family: inherit;
            transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
        }

        .form-group input::placeholder {
            color: rgba(120, 160, 220, 0.4);
        }

        .form-group input:focus {
            outline: none;
            border-color: #0066dd;
            background: rgba(0, 82, 204, 0.08);
            box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.15);
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0052cc 0%, #0077ff 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.3px;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
            margin-top: 4px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 82, 204, 0.45);
        }

        .btn:disabled {
            background: rgba(50, 70, 110, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-top: 16px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: rgba(0, 180, 100, 0.12);
            color: #4dddaa;
            border: 1px solid rgba(0, 180, 100, 0.25);
        }

        .message.error {
            background: rgba(220, 50, 50, 0.12);
            color: #ff7a7a;
            border: 1px solid rgba(220, 50, 50, 0.25);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(130, 170, 230, 0.7);
            font-size: 13px;
        }

        .login-link a {
            color: #4da6ff;
            text-decoration: none;
            font-weight: 600;
        }

        .loading {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .notice-box {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 11px 14px;
            background: rgba(0, 82, 204, 0.08);
            border: 1px solid rgba(0, 82, 204, 0.2);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .notice-box p {
            font-size: 12px;
            color: rgba(120, 170, 230, 0.8);
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .form-grid { grid-template-columns: 1fr; }
            .container { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="orb-left"></div>

    <div class="container">
        <div class="header">
            <div class="logo-area">
                <div class="kominfo-badge">
                    <img src="logo-kominfo.png" class="kominfo-logo-icon" alt="Logo Kominfo">
                    <div class="kominfo-text">
                        <div class="brand">KOMINFO</div>
                    </div>
                </div>
            </div>
            <div class="divider-line"></div>
            <h1>Registrasi Hotspot</h1>
            <p>Daftarkan akun untuk akses WiFi</p>
        </div>

        <div class="notice-box">
            <span>ℹ️</span>
            <p>Akun Anda akan diverifikasi oleh admin sebelum dapat digunakan.</p>
        </div>

        <form id="registerForm">
            <div class="form-grid">
                <div class="form-group form-group-full">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" name="name" required placeholder="Masukkan nama lengkap">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="email@contoh.com">
                </div>

                <div class="form-group">
                    <label for="phone">Nomor Telepon</label>
                    <input type="tel" id="phone" name="phone" required placeholder="08xx-xxxx-xxxx">
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Buat username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Buat password">
                </div>

                <div class="form-group form-group-full">
                    <label for="confirmPassword">Konfirmasi Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Ulangi password">
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Daftar Sekarang</span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="login-link">
            Sudah punya akun? <a href="login.html">Login di sini</a>
        </div>
    </div>

    <script>
        // Menggunakan domain Vercel utama yang aktif untuk menghindari error captive portal MikroTik
        const BACKEND_URL = 'https://raihan-ivory.vercel.app';

        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('Password tidak cocok!', 'error');
                return;
            }

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                username: document.getElementById('username').value,
                password: password
            };

            // Loading state
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Memproses...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message + ' Mengalihkan ke halaman login...', 'success');
                    form.reset();

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Terjadi kesalahan koneksi ke server.', 'error');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Daftar Sekarang';
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';

            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
